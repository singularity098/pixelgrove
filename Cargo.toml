[package]
name = "pixelgrove"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Ultra-light, fast, self-hosted photo and video library"
license = "MIT"
repository = "https://github.com/singularity098/pixelgrove"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
