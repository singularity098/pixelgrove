[package]
name = "pixelgrove"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Ultra-light, fast, self-hosted photo and video library"
license = "MIT"
repository = "https://github.com/singularity098/pixelgrove"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
cookie = "0.18"
fast_image_resize = "6.1.0"
getrandom = "0.4.3"
globset = "0.4.20"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp"] }
imagesize = "0.15.0"
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
lru = "0.18.5"
mimalloc = { version = "0.1.52", default-features = false }
nom-exif = "3.8.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Password hashing is deliberately expensive; unoptimised it makes tests and dev
# logins crawl.
[profile.dev.package.argon2]
opt-level = 3
